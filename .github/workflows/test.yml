name: test

on:
  push:
    branches:
      - master
      - test
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: libwg/wireguard-go/go.mod
      - name: build libwg
        run: libwg/build.sh --test
      - name: test Rust behavior
        run: cargo test --locked
      - name: test CLI behavior
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: check scripts
        run: |
          bash -n scripts/corplink-traffic.sh
          bash -n scripts/corplink-github.sh
          python3 -m py_compile scripts/*.py

  build-windows:
    name: build-windows
    runs-on: windows-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: libwg/wireguard-go/go.mod
      - name: build libwg
        run: cd libwg && ./build.ps1 --test
      - name: rust install gnu toolchain
        run: rustup toolchain install stable-gnu
      - name: rust use gnu toolchain
        run: rustup default stable-x86_64-pc-windows-gnu
      - name: build package
        run: cargo build --release
      - name: build check result
        run: |
          Move-Item -Path "target/release/corplink-rs.exe" -Destination "."
          Copy-Item -Path "config.template.json" -Destination "config.json"
          Compress-Archive -Path corplink-rs.exe,config.json -Destination corplink-rs-${{ github.ref_name }}-windows.zip
